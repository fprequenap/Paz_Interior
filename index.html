body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;max-width:430px;margin:0 auto;min-height:100dvh}

.btn:active{opacity:.85}

.flag.on{background:rgba(92,74,50,.12)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}

.calicon .top{background:var(--accent);width:100%;text-align:center;padding:0 0 1px}

.calicon .num{font-size:13px;font-weight:800;color:var(--text);line-height:1.1}
.tabs{display:flex;margin-bottom:8px}
.tab{flex:1;padding:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;text-align:center}
.tab.on{background:var(--accent);color:#FFF}
.tab.off{background:var(--borderL);color:var(--textL)}
.tab:first-child{border-radius:8px 0 0 8px}.tab:last-child{border-radius:0 8px 8px 0}
.pill{font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 14px;border-radius:12px;display:inline-block}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}

.opt:active{opacity:.85}
.switch{width:50px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s}
.switch .knob{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#FFF;transition:left .2s}
textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--text);background:var(--cardAlt);resize:vertical;font-family:inherit}

.repgrp{margin-bottom:10px}
.rephdr{padding:8px;display:flex;justify-content:space-between;border-radius:8px 8px 0 0}

.reprow{display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer}

// ═══ SEEDED WEEKLY SHUFFLE ═══
function seedShuffle(weekNum,year){
  let s=weekNum*7919+year*104729;
  const rng=()=>{s=((s*16807)%2147483647);return(s&0x7fffffff)/0x7fffffff;};
  const arr=[0,1,2,3,4,5,6];
  for(let i=6;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function getDoy(d){
  const utc=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const jan1=Date.UTC(d.getFullYear(),0,1);
  return Math.floor((utc-jan1)/864e5);
}
function getFatigaForDate(d){
  const doy=getDoy(d);
  const weekNum=Math.floor(doy/7);
  const dayInWeek=doy%7;
  const order=seedShuffle(weekNum,d.getFullYear());
  return F[order[dayInWeek]];
}
function getWeekOrder(d){
  const doy=getDoy(d);
  const weekNum=Math.floor(doy/7);
  return seedShuffle(weekNum,d.getFullYear()).map(i=>F[i]);
}

// ═══ MUSIC FOR DAY ═══
function getMusicForDate(d,fatId){
  const doy=getDoy(d);
  const weekIdx=Math.floor(doy/7)%8;
  return MU[fatId][weekIdx];
}
function getPsalmForDate(d,fatId,lang){
  const doy=getDoy(d);
  const weekIdx=Math.floor(doy/7)%8;
  const bank=(SAL[lang]||SAL.es)[fatId];
  if(bank&&bank[weekIdx])return bank[weekIdx];
  return(SAL.es[fatId]||[])[weekIdx]||null;
}

// ═══ PSALM DATA — 56 PSALMS × 6 LANGUAGES ═══
// 8 per fatigue, rotating weekly (same cycle as music)
// v = psalm verses (liturgical translation), g = García Cordero fragment (paraphrased, BAC)
const SAL={es:{
soberbia:[
{n:130,t:'Señor, mi corazón no es ambicioso',v:'Señor, mi corazón no es ambicioso, ni mis ojos altaneros; no pretendo grandezas que superan mi capacidad; sino que acallo y modero mis deseos, como un niño en brazos de su madre.',g:'El salmista renuncia a toda empresa brillante y disciplina sus deseos para mantenerse ante Dios en actitud de niño que se entrega a la solicitud de su madre.'},
{n:8,t:'¿Qué es el hombre para que te acuerdes de él?',v:'Cuando contemplo el cielo, obra de tus dedos, la luna y las estrellas que has creado, ¿qué es el hombre para que te acuerdes de él, el ser humano para que cuides de él?',g:'Ante la inmensidad de la creación, el hombre reconoce su pequeñez. Solo Dios da grandeza al hombre al acordarse de él y coronarlo de gloria.'},
{n:50,t:'Misericordia, Dios mío',v:'Misericordia, Dios mío, por tu bondad, por tu inmensa compasión borra mi culpa. Oh Dios, crea en mí un corazón puro, renuévame por dentro con espíritu firme.',g:'El Miserere es la oración del pecador arrepentido que reconoce su miseria. Solo desde la humildad del corazón contrito puede el hombre pedir a Dios la renovación interior.'},
{n:'138 I',t:'Señor, tú me sondeas y me conoces',v:'Señor, tú me sondeas y me conoces; me conoces cuando me siento o me levanto, de lejos penetras mis pensamientos. Tú has creado mis entrañas, me has tejido en el seno materno.',g:'Dios conoce al hombre hasta el fondo de su ser. Nada escapa a su mirada. Esta omnisciencia divina invita a la humildad radical: ante Dios no cabe el disimulo.'},
{n:89,t:'Señor, tú has sido nuestro refugio',v:'Señor, tú has sido nuestro refugio de generación en generación. Antes que naciesen los montes, antes de que formases la tierra, desde siempre y por siempre tú eres Dios.',g:'La eternidad de Dios se contrapone a la fugacidad de la vida humana. El salmista reconoce la fragilidad del hombre ante la majestad divina.'},
{n:31,t:'Dichoso el que está absuelto de su culpa',v:'Dichoso el que está absuelto de su culpa, a quien le han sepultado su pecado. Dichoso el hombre a quien el Señor no le apunta el delito.',g:'La verdadera dicha no está en la autoafirmación sino en el perdón recibido. El hombre humilde que reconoce su culpa encuentra en Dios la absolución y la paz.'},
{n:14,t:'Señor, ¿quién puede hospedarse en tu tienda?',v:'Señor, ¿quién puede hospedarse en tu tienda y habitar en tu monte santo? El que procede honradamente y practica la justicia, el que tiene intenciones leales.',g:'El acceso a la presencia de Dios exige integridad moral. No basta la apariencia exterior; Dios pide un corazón recto que no se envanece de sí mismo.'},
{n:100,t:'Voy a cantar la bondad y la justicia',v:'Voy a cantar la bondad y la justicia, para ti es mi música, Señor. Voy a explicar el camino perfecto: ¿cuándo vendrás a mí? Andaré con rectitud de corazón.',g:'El salmista se propone un programa de vida recta ante Dios. La rectitud de corazón es el fruto maduro de quien ha dejado atrás la soberbia.'}],
envidia:[
{n:111,t:'Dichoso quien teme al Señor',v:'Dichoso quien teme al Señor y ama de corazón sus mandatos. Su linaje será poderoso en la tierra; reparte limosna a los pobres; su caridad es constante y sin falta.',g:'El justo no envidia los bienes ajenos porque ha encontrado su riqueza en el temor del Señor. Su generosidad brota de la abundancia interior.'},
{n:32,t:'Aclamad, justos, al Señor',v:'Aclamad, justos, al Señor, que merece la alabanza de los buenos. La palabra del Señor es sincera, y todas sus acciones son leales. Él ama la justicia y el derecho.',g:'La alegría del justo nace de contemplar la fidelidad de Dios. Quien reconoce la bondad divina sobre todos no tiene razón para envidiar a nadie.'},
{n:66,t:'El Señor tenga piedad y nos bendiga',v:'El Señor tenga piedad y nos bendiga, ilumine su rostro sobre nosotros; conozca la tierra tus caminos, todos los pueblos tu salvación.',g:'La bendición de Dios no es privilegio de un pueblo sino don universal. El salmista desea que todos los pueblos conozcan la salvación del Señor.'},
{n:145,t:'Alaba, alma mía, al Señor',v:'Alaba, alma mía, al Señor: alabaré al Señor mientras viva. No confiéis en los príncipes, seres de polvo que no pueden salvar. Dichoso a quien auxilia el Dios de Jacob.',g:'La verdadera seguridad no está en los poderosos del mundo sino en Dios, que hace justicia a los oprimidos y da pan a los hambrientos.'},
{n:116,t:'Alabad al Señor, todas las naciones',v:'Alabad al Señor, todas las naciones; aclamadlo, todos los pueblos. Su misericordia es estable, la fidelidad del Señor dura por siempre.',g:'Este breve salmo invita a todos los pueblos sin excepción a reconocer la misericordia universal de Dios. Nadie queda excluido de su fidelidad.'},
{n:97,t:'Cantad al Señor un cántico nuevo',v:'Cantad al Señor un cántico nuevo, porque ha hecho maravillas. Los confines de la tierra han contemplado la victoria de nuestro Dios.',g:'La salvación de Dios no es patrimonio exclusivo de nadie. Toda la tierra ha contemplado su victoria y está llamada a participar de ella.'},
{n:99,t:'Aclama al Señor, tierra entera',v:'Aclama al Señor, tierra entera, servid al Señor con alegría, entrad en su presencia con aclamaciones. Sabed que el Señor es Dios.',g:'El servicio gozoso a Dios es la vocación de toda la humanidad. Quien sirve con alegría no tiene espacio para la amargura de la envidia.'},
{n:134,t:'Alabad el nombre del Señor',v:'Alabad el nombre del Señor, alabadlo, siervos del Señor, que estáis en la casa del Señor, en los atrios de la casa de nuestro Dios.',g:'La alabanza comunitaria une a los fieles en una misma misión. En la casa de Dios no hay lugar para la rivalidad, solo para la alabanza compartida.'}],
ira:[
{n:61,t:'Solo en Dios descansa mi alma',v:'Solo en Dios descansa mi alma, porque de Él viene mi salvación. Solo Él es mi roca y mi salvación, mi alcázar: no vacilaré.',g:'El alma agitada por las pasiones encuentra su único reposo en Dios. La serenidad interior no depende de las circunstancias sino de la confianza en el Señor.'},
{n:85,t:'Inclina tu oído, Señor, escúchame',v:'Inclina tu oído, Señor, escúchame, que soy un pobre desamparado. Tú, Señor, eres bueno y clemente, rico en misericordia con los que te invocan.',g:'Dios se inclina hacia el que suplica con humildad. Su misericordia es la respuesta a quien depone la ira y reconoce su necesidad de auxilio divino.'},
{n:41,t:'Como busca la cierva corrientes de agua',v:'Como busca la cierva corrientes de agua, así mi alma te busca a ti, Dios mío. Tiene sed de Dios, del Dios vivo: ¿cuándo entraré a ver el rostro de Dios?',g:'La sed de Dios es el anhelo más profundo del alma. Quien busca al Dios vivo con esta intensidad transforma su inquietud en esperanza paciente.'},
{n:129,t:'Desde lo hondo a ti grito, Señor',v:'Desde lo hondo a ti grito, Señor: Señor, escucha mi voz. Mi alma espera en el Señor, espera en su palabra; mi alma aguarda al Señor.',g:'El De Profundis es la oración de quien ha tocado fondo. Desde la hondura del sufrimiento brota la esperanza más firme en la misericordia de Dios.'},
{n:142,t:'Señor, escucha mi oración',v:'Señor, escucha mi oración, presta oído a mi súplica. Recuerdo los tiempos antiguos, medito todas tus acciones, considero las obras de tus manos.',g:'En medio de la tribulación, el salmista recuerda las obras pasadas de Dios. La memoria de sus bondades calma la agitación del espíritu.'},
{n:76,t:'Alzo mi voz a Dios gritando',v:'Alzo mi voz a Dios gritando, alzo mi voz a Dios para que me escuche. Recuerdo a Dios y me quejo, medito y me siento desfallecer.',g:'El grito del alma atribulada no es signo de desesperación sino de confianza. Quien clama a Dios en la aflicción reconoce que solo Él puede dar verdadera paz.'},
{n:56,t:'Misericordia, Dios mío, misericordia',v:'Misericordia, Dios mío, misericordia, que mi alma se refugia en ti; a la sombra de tus alas me refugio hasta que pase la calamidad.',g:'El refugio bajo las alas de Dios es imagen de protección maternal. Quien se refugia en Él encuentra la calma que ninguna venganza puede dar.'},
{n:'26 I',t:'El Señor es mi luz y mi salvación',v:'El Señor es mi luz y mi salvación, ¿a quién temeré? El Señor es la defensa de mi vida, ¿quién me hará temblar?',g:'La confianza plena en Dios disipa todo temor y toda ira. Quien tiene al Señor como luz no necesita devolver golpe por golpe.'}],
pereza:[
{n:95,t:'Cantad al Señor un cántico nuevo',v:'Cantad al Señor un cántico nuevo, cantad al Señor toda la tierra. Contad a los pueblos su gloria, sus maravillas a todas las naciones.',g:'El cántico nuevo exige la renovación del corazón. La alabanza activa arranca al alma de la inercia y la pone en movimiento hacia Dios.'},
{n:117,t:'Dad gracias al Señor porque es bueno',v:'Dad gracias al Señor porque es bueno, porque es eterna su misericordia. Este es el día en que actuó el Señor: sea nuestra alegría y nuestro gozo.',g:'Cada día es día del Señor y merece ser vivido con gratitud y entusiasmo. La acción de gracias es el antídoto contra la desgana espiritual.'},
{n:148,t:'Alabad al Señor en el cielo',v:'Alabad al Señor en el cielo, alabad al Señor en lo alto. Alabadlo, sol y luna; alabadlo, estrellas lucientes.',g:'Toda la creación alaba a Dios con su misma existencia. El hombre que contempla este himno universal no puede permanecer inmóvil ni indiferente.'},
{n:149,t:'Cantad al Señor un cántico nuevo',v:'Cantad al Señor un cántico nuevo, resuene su alabanza en la asamblea de los fieles. Que se alegren con su Rey; que alaben su nombre con danzas.',g:'La alabanza litúrgica es acción: canto, danza, instrumentos. El culto a Dios no admite la pasividad sino la entrega gozosa de todo el ser.'},
{n:91,t:'Es bueno dar gracias al Señor',v:'Es bueno dar gracias al Señor y tocar para tu nombre, oh Altísimo, proclamar por la mañana tu misericordia y de noche tu fidelidad.',g:'La jornada del justo comienza y termina con Dios. Esta disciplina de la oración matutina y vespertina estructura la vida y vence la pereza espiritual.'},
{n:28,t:'Hijos de Dios, aclamad al Señor',v:'Hijos de Dios, aclamad al Señor, aclamad la gloria y el poder del Señor. La voz del Señor es potente, la voz del Señor es magnífica.',g:'La voz poderosa de Dios sacude la naturaleza entera. Ante esta majestad, el letargo del alma no tiene cabida.'},
{n:80,t:'Aclamad a Dios, nuestra fuerza',v:'Aclamad a Dios, nuestra fuerza; dad vítores al Dios de Jacob. Acompañad, tocad los panderos, las cítaras templadas y las arpas.',g:'Israel celebra sus fiestas con vigor y alegría. El servicio de Dios exige el esfuerzo gozoso de quien sabe que su trabajo tiene sentido eterno.'},
{n:150,t:'Alabad al Señor en su templo',v:'Alabad al Señor en su templo, alabadlo en su fuerte firmamento. Alabadlo por sus obras magníficas, alabadlo por su inmensa grandeza. ¡Todo ser que alienta alabe al Señor!',g:'El salterio culmina con este himno total. Nada ni nadie queda dispensado de alabar a Dios: la pereza espiritual contradice el destino mismo de la criatura.'}],
avaricia:[
{n:23,t:'Del Señor es la tierra y cuanto la llena',v:'Del Señor es la tierra y cuanto la llena, el orbe y todos sus habitantes: Él la fundó sobre los mares, Él la afianzó sobre los ríos.',g:'Todo pertenece al Señor como Creador. El hombre no es dueño absoluto sino administrador de los bienes que le han sido confiados por Dios.'},
{n:'48 I',t:'Oíd esto, todas las naciones',v:'Oíd esto, todas las naciones; escuchadlo, habitantes del orbe. ¿Por qué habré de temer en los días de desgracia? Nadie puede pagar a Dios su propio rescate.',g:'Las riquezas no pueden rescatar al hombre de la muerte. El salmista denuncia la insensatez de quien confía en sus bienes como garantía de vida.'},
{n:15,t:'Protégeme, Dios mío, que me refugio en ti',v:'Protégeme, Dios mío, que me refugio en ti. Yo digo al Señor: tú eres mi bien. El Señor es el lote de mi heredad y mi copa, mi suerte está en tu mano.',g:'Dios mismo es la herencia del justo. Quien tiene al Señor como porción no necesita acumular bienes terrenos para sentirse seguro.'},
{n:126,t:'Si el Señor no construye la casa',v:'Si el Señor no construye la casa, en vano se cansan los albañiles. Si el Señor no guarda la ciudad, en vano vigilan los centinelas.',g:'Todo esfuerzo humano es vano si no cuenta con la bendición de Dios. La verdadera seguridad no viene del trabajo obsesivo ni de la acumulación sino de la providencia divina.'},
{n:146,t:'Alabad al Señor, que la música es buena',v:'El Señor reconstruye Jerusalén, reúne a los deportados de Israel. Él sana los corazones destrozados, venda sus heridas.',g:'Dios se ocupa de los necesitados y de los corazones rotos. Su providencia alcanza a las estrellas y a los humildes, a los cuervos y a los pobres.'},
{n:84,t:'Señor, has sido bueno con tu tierra',v:'Señor, has sido bueno con tu tierra, has restaurado la suerte de Jacob. La misericordia y la fidelidad se encuentran, la justicia y la paz se besan.',g:'La restauración de Israel es obra gratuita de Dios. La generosidad divina precede siempre al mérito humano y lo hace posible.'},
{n:40,t:'Dichoso el que cuida del pobre',v:'Dichoso el que cuida del pobre y desvalido; en el día aciago lo pondrá a salvo el Señor. El Señor lo guarda y lo conserva en vida.',g:'La bienaventuranza del que da al necesitado. Dios devuelve con creces lo que el generoso entrega, no en moneda sino en protección y vida.'},
{n:124,t:'Los que confían en el Señor',v:'Los que confían en el Señor son como el monte Sión: no tiembla, está asentado para siempre. Como Jerusalén rodeada de montañas, así el Señor rodea a su pueblo.',g:'La confianza en Dios da al alma una firmeza que ninguna riqueza material puede proporcionar. El Señor es muralla inexpugnable para quien confía en Él.'}],
gula:[
{n:62,t:'Oh Dios, tú eres mi Dios, por ti madrugo',v:'Oh Dios, tú eres mi Dios, por ti madrugo; mi alma está sedienta de ti. Mi alma está unida a ti, tu diestra me sostiene.',g:'El alma que madruga buscando a Dios expresa un hambre que no se sacia con alimentos terrenos. Solo la unión con Dios calma la sed más profunda del hombre.'},
{n:64,t:'Oh Dios, tú mereces un himno en Sión',v:'Oh Dios, tú mereces un himno en Sión. Tú atiendes a la tierra y la riegas, la enriqueces sin medida. Coronas el año con tus bienes.',g:'Dios provee con abundancia a la creación. Los frutos de la tierra son don suyo, no conquista del hombre, y merecen ser recibidos con gratitud y moderación.'},
{n:147,t:'Glorifica al Señor, Jerusalén',v:'Glorifica al Señor, Jerusalén; alaba a tu Dios, Sión. Él te sacia con flor de harina, envía su mensaje a la tierra.',g:'Dios sacia a su pueblo con lo mejor. Pero la verdadera saciedad no está en la flor de harina sino en la Palabra que envía a la tierra.'},
{n:'144 I',t:'Te ensalzaré, Dios mío, mi rey',v:'Te ensalzaré, Dios mío, mi rey, bendeciré tu nombre por siempre jamás. El Señor es bueno con todos, es cariñoso con todas sus criaturas.',g:'La bondad de Dios se extiende a todas sus criaturas sin excepción. El hombre templado imita esta generosidad sin acaparar para sí lo que es don para todos.'},
{n:135,t:'Dad gracias al Señor porque es bueno',v:'Dad gracias al Señor porque es bueno, porque es eterna su misericordia. Él da alimento a toda carne, porque es eterna su misericordia.',g:'Dios alimenta a toda criatura viviente. El hombre agradecido reconoce que el alimento es don y no derecho, y lo recibe con templanza.'},
{n:29,t:'Te ensalzaré, Señor, porque me has librado',v:'Te ensalzaré, Señor, porque me has librado y no has dejado que mis enemigos se rían de mí. Señor, sacaste mi vida del abismo.',g:'La liberación del peligro invita a la acción de gracias sobria y profunda. Quien ha sido rescatado no vuelve a caer en los excesos que lo esclavizaban.'},
{n:45,t:'Dios es nuestro refugio y nuestra fuerza',v:'Dios es nuestro refugio y nuestra fuerza, poderoso defensor en el peligro. Por eso no tememos aunque tiemble la tierra.',g:'La seguridad que da Dios es superior a todo placer sensible. Quien ha encontrado este refugio no necesita buscar consuelo en los excesos.'},
{n:92,t:'El Señor reina, vestido de majestad',v:'El Señor reina, vestido de majestad; el Señor, vestido y ceñido de poder. Tu trono está firme desde siempre, y tú eres eterno.',g:'La majestad de Dios sobrepasa toda grandeza terrena. Ante su eternidad, los placeres fugaces del mundo se muestran en su verdadera proporción.'}],
lujuria:[
{n:42,t:'Hazme justicia, oh Dios',v:'Hazme justicia, oh Dios, defiende mi causa contra gente sin piedad. Envía tu luz y tu verdad: que ellas me guíen y me conduzcan hasta tu monte santo.',g:'La luz y la verdad de Dios guían al hombre hacia la pureza. Quien camina en la verdad divina distingue entre el amor auténtico y la mera pasión.'},
{n:83,t:'¡Qué deseables son tus moradas!',v:'¡Qué deseables son tus moradas, Señor de los ejércitos! Mi alma se consume y anhela los atrios del Señor; mi corazón y mi carne retozan por el Dios vivo.',g:'El deseo ardiente del templo de Dios purifica los demás deseos. Cuando el corazón encuentra su verdadero objeto, los afectos desordenados pierden su poder.'},
{n:'118,105',t:'Lámpara es tu palabra para mis pasos',v:'Lámpara es tu palabra para mis pasos, luz en mi sendero. Soy siervo tuyo: dame inteligencia para conocer tus preceptos.',g:'La Palabra de Dios ilumina el camino y protege de las tinieblas del desorden. Quien medita la ley divina encuentra claridad para discernir lo puro de lo impuro.'},
{n:'26 II',t:'Escúchame, Señor, que te llamo',v:'Escúchame, Señor, que te llamo; ten piedad, respóndeme. Oigo en mi corazón: buscad mi rostro. Tu rostro buscaré, Señor.',g:'La búsqueda del rostro de Dios es el deseo más noble del alma. Quien busca contemplar a Dios aprende a mirar a los demás con respeto y reverencia.'},
{n:120,t:'Levanto mis ojos a los montes',v:'Levanto mis ojos a los montes: ¿de dónde me vendrá el auxilio? El auxilio me viene del Señor, que hizo el cielo y la tierra.',g:'El auxilio viene de lo alto, no de las criaturas. El salmista levanta la mirada hacia Dios, apartándola de todo lo que la enturbia.'},
{n:121,t:'¡Qué alegría cuando me dijeron!',v:'¡Qué alegría cuando me dijeron: Vamos a la casa del Señor! Ya están pisando nuestros pies tus umbrales, Jerusalén.',g:'La alegría de la peregrinación hacia la ciudad santa eleva el espíritu por encima de las satisfacciones terrenas. La comunión con Dios y su pueblo purifica los afectos.'},
{n:122,t:'A ti levanto mis ojos',v:'A ti levanto mis ojos, a ti que habitas en el cielo. Como están los ojos de la esclava fijos en las manos de su señora, así están nuestros ojos en el Señor.',g:'La mirada fija en Dios ordena todas las demás miradas. Quien contempla al Señor con ojos de siervo fiel aprende la pureza del corazón.'},
{n:'138 II',t:'Tú has creado mis entrañas',v:'Tú has creado mis entrañas, me has tejido en el seno materno. Te doy gracias porque me has escogido portentosamente, porque son admirables tus obras.',g:'El cuerpo humano es obra admirable de Dios. El salmista contempla con reverencia el misterio de la vida, reconociendo en la carne un templo del Creador.'}]},

en:{soberbia:[{n:130,t:'My heart is not proud, O Lord',v:'O Lord, my heart is not proud, nor are my eyes haughty; I do not busy myself with great matters, with things too sublime for me. Truly I have set my soul in silence and peace.',g:'The psalmist renounces all ambitious enterprise, disciplining his desires to remain before God like a child trusting in its mother\'s care.'},{n:8,t:'What is man that you are mindful of him?',v:'When I see the heavens, the work of your hands, the moon and stars which you arranged, what is man that you should keep him in mind, mortal man that you care for him?',g:'Before the immensity of creation, man recognizes his smallness. Only God gives man greatness by remembering him and crowning him with glory.'},{n:50,t:'Have mercy on me, O God',v:'Have mercy on me, God, in your kindness; in your compassion blot out my offense. O God, create a clean heart in me, put a steadfast spirit within me.',g:'The Miserere is the prayer of the repentant sinner who acknowledges his misery. Only from the humility of a contrite heart can man ask God for interior renewal.'},{n:'138 I',t:'O Lord, you search me and you know me',v:'O Lord, you search me and you know me. You know my resting and my rising; you discern my purpose from afar. For it was you who created my being, knit me together in my mother\'s womb.',g:'God knows man to the depths of his being. Nothing escapes his gaze. This divine omniscience invites radical humility: before God there is no disguise.'},{n:89,t:'Lord, you have been our refuge',v:'Lord, you have been our refuge age after age. Before the mountains were born, before the earth or the world came to birth, you were God from all eternity.',g:'God\'s eternity contrasts with the brevity of human life. The psalmist recognizes man\'s fragility before divine majesty.'},{n:31,t:'Happy the man whose offense is forgiven',v:'Happy the man whose offense is forgiven, whose sin is remitted. O happy the man to whom the Lord imputes no guilt.',g:'True happiness lies not in self-assertion but in forgiveness received. The humble man who acknowledges his guilt finds in God absolution and peace.'},{n:14,t:'Lord, who shall dwell on your holy mountain?',v:'Lord, who shall dwell on your holy mountain? He who walks without fault, who acts with justice, who speaks the truth from his heart.',g:'Access to God\'s presence demands moral integrity. Outward appearance is not enough; God asks for an upright heart that does not boast of itself.'},{n:100,t:'I will sing of mercy and justice',v:'I will sing of mercy and justice; to you, O Lord, I will sing. I will walk in the way of perfection. When will you come to me? I will walk with blameless heart.',g:'The psalmist proposes a program of upright living before God. Rectitude of heart is the mature fruit of one who has left pride behind.'}],envidia:[{n:111,t:'Happy the man who fears the Lord',v:'Happy the man who fears the Lord, who takes delight in his commands. He is a light in the darkness for the upright; he gives generously to the poor.',g:'The just man does not envy others\' goods because he has found his wealth in fearing the Lord. His generosity flows from interior abundance.'},{n:32,t:'Ring out your joy to the Lord',v:'Ring out your joy to the Lord, O you just; for praise is fitting for loyal hearts. The word of the Lord is faithful and all his works are to be trusted.',g:'The just man\'s joy springs from contemplating God\'s faithfulness. Whoever recognizes divine goodness over all has no reason to envy anyone.'},{n:66,t:'O God, be gracious and bless us',v:'O God, be gracious and bless us and let your face shed its light upon us. So will your ways be known upon earth and all nations learn your saving help.',g:'God\'s blessing is not the privilege of one people but a universal gift. The psalmist desires that all peoples know the Lord\'s salvation.'},{n:145,t:'My soul, give praise to the Lord',v:'My soul, give praise to the Lord; I will praise the Lord all my days. Put no trust in princes, in mortal men who cannot save. He is happy who is helped by the God of Jacob.',g:'True security lies not in the world\'s powerful but in God, who does justice for the oppressed and gives bread to the hungry.'},{n:116,t:'O praise the Lord, all you nations',v:'O praise the Lord, all you nations; acclaim him, all you peoples! Strong is his love for us; he is faithful forever.',g:'This brief psalm invites all peoples without exception to recognize God\'s universal mercy. No one is excluded from his faithfulness.'},{n:97,t:'Sing a new song to the Lord',v:'Sing a new song to the Lord for he has worked wonders. All the ends of the earth have seen the salvation of our God.',g:'God\'s salvation is no one\'s exclusive heritage. The whole earth has witnessed his victory and is called to share in it.'},{n:99,t:'Cry out with joy to the Lord',v:'Cry out with joy to the Lord, all the earth. Serve the Lord with gladness; come before him, singing for joy. Know that he, the Lord, is God.',g:'Joyful service to God is the vocation of all humanity. Those who serve with joy have no room for the bitterness of envy.'},{n:134,t:'Praise the name of the Lord',v:'Praise the name of the Lord, praise him, servants of the Lord, who stand in the house of the Lord, in the courts of the house of our God.',g:'Communal praise unites the faithful in a single mission. In God\'s house there is no place for rivalry, only for shared worship.'}],ira:[{n:61,t:'In God alone is my soul at rest',v:'In God alone is my soul at rest; my help comes from him. He alone is my rock, my stronghold; my fortress: I stand firm.',g:'The soul agitated by passions finds its only rest in God. Interior serenity depends not on circumstances but on trust in the Lord.'},{n:85,t:'Turn your ear, O Lord, and give answer',v:'Turn your ear, O Lord, and give answer, for I am poor and needy. You, O Lord, are good and forgiving, full of love to all who call.',g:'God inclines toward the one who humbly pleads. His mercy is the answer for whoever sets aside anger and acknowledges the need for divine help.'},{n:41,t:'Like the deer that yearns for running streams',v:'Like the deer that yearns for running streams, so my soul is yearning for you, my God. My soul is thirsting for God, the God of my life.',g:'Thirst for God is the deepest yearning of the soul. Whoever seeks the living God with this intensity transforms restlessness into patient hope.'},{n:129,t:'Out of the depths I cry to you, O Lord',v:'Out of the depths I cry to you, O Lord; Lord, hear my voice! My soul is waiting for the Lord, I count on his word.',g:'The De Profundis is the prayer of one who has reached the bottom. From the depths of suffering springs the firmest hope in God\'s mercy.'},{n:142,t:'Lord, listen to my prayer',v:'Lord, listen to my prayer; turn your ear to my appeal. I remember the days that are past; I ponder all your works.',g:'Amid tribulation, the psalmist recalls God\'s past works. The memory of his goodness calms the agitation of the spirit.'},{n:76,t:'I cry aloud to God',v:'I cry aloud to God, cry aloud to God that he may hear me. I remember my God and I groan; I ponder and my spirit faints.',g:'The cry of the afflicted soul is not despair but trust. Whoever calls out to God in affliction recognizes that He alone can give true peace.'},{n:56,t:'Have mercy on me, God, have mercy',v:'Have mercy on me, God, have mercy, for in you my soul has taken refuge. In the shadow of your wings I take refuge till the storms of destruction pass by.',g:'Refuge beneath God\'s wings is an image of maternal protection. Whoever takes refuge in Him finds the calm that no revenge can provide.'},{n:'26 I',t:'The Lord is my light and my help',v:'The Lord is my light and my help; whom shall I fear? The Lord is the stronghold of my life; before whom shall I shrink?',g:'Full trust in God dispels all fear and all anger. Whoever has the Lord as light needs not return blow for blow.'}],pereza:[{n:95,t:'O sing a new song to the Lord',v:'O sing a new song to the Lord, sing to the Lord all the earth. Proclaim his help day by day, tell among the nations his glory.',g:'The new song demands a renewal of heart. Active praise tears the soul from inertia and sets it in motion toward God.'},{n:117,t:'Give thanks to the Lord for he is good',v:'Give thanks to the Lord for he is good, for his love has no end. This day was made by the Lord; we rejoice and are glad.',g:'Each day is the Lord\'s day and deserves to be lived with gratitude and enthusiasm. Thanksgiving is the antidote to spiritual listlessness.'},{n:148,t:'Praise the Lord from the heavens',v:'Praise the Lord from the heavens, praise him in the heights. Praise him, sun and moon; praise him, shining stars.',g:'All creation praises God by its very existence. Man who contemplates this universal hymn cannot remain motionless or indifferent.'},{n:149,t:'Sing a new song to the Lord',v:'Sing a new song to the Lord, his praise in the assembly of the faithful. Let them praise his name with dancing; let them sing to him with timbrel and harp.',g:'Liturgical praise is action: song, dance, instruments. Worship admits no passivity but the joyful surrender of one\'s whole being.'},{n:91,t:'It is good to give thanks to the Lord',v:'It is good to give thanks to the Lord, to make music to your name, O Most High, to proclaim your love in the morning and your truth in the watches of the night.',g:'The just man\'s day begins and ends with God. This discipline of morning and evening prayer structures life and overcomes spiritual sloth.'},{n:28,t:'O give the Lord, you sons of God',v:'O give the Lord, you sons of God, give the Lord glory and power. The voice of the Lord is mighty; the voice of the Lord is splendor.',g:'God\'s powerful voice shakes all of nature. Before such majesty, the soul\'s lethargy has no place.'},{n:80,t:'Raise a shout of joy for God',v:'Raise a shout of joy for God our strength, shout in triumph to the God of Jacob! Raise a song and sound the timbrel.',g:'Israel celebrates its feasts with vigor and joy. God\'s service demands the joyful effort of those who know their work has eternal meaning.'},{n:150,t:'Praise God in his holy place',v:'Praise God in his holy place; praise him in his mighty heavens. Praise him for his powerful deeds; praise his surpassing greatness. Let everything that lives and breathes give praise to the Lord!',g:'The Psalter culminates in this total hymn. Nothing and no one is dispensed from praising God: spiritual sloth contradicts the very destiny of the creature.'}],avaricia:[{n:23,t:'The Lord\'s is the earth and its fullness',v:'The Lord\'s is the earth and its fullness, the world and all its peoples. It is he who set it on the seas, on the waters he made it firm.',g:'Everything belongs to the Lord as Creator. Man is not absolute owner but steward of the goods entrusted to him by God.'},{n:'48 I',t:'Hear this, all you peoples',v:'Hear this, all you peoples; give heed, all who dwell in the world. Why should I fear in evil days? No man can buy his own ransom or pay a price to God for his life.',g:'Riches cannot ransom man from death. The psalmist denounces the folly of trusting in possessions as a guarantee of life.'},{n:15,t:'Preserve me, God, I take refuge in you',v:'Preserve me, God, I take refuge in you. I say to the Lord: You are my God. O Lord, it is you who are my portion and cup; it is you yourself who are my prize.',g:'God himself is the just man\'s inheritance. Whoever has the Lord as his portion needs not accumulate earthly goods to feel secure.'},{n:126,t:'If the Lord does not build the house',v:'If the Lord does not build the house, in vain do its builders labor. If the Lord does not watch over the city, in vain does the watchman keep vigil.',g:'All human effort is vain without God\'s blessing. True security comes not from obsessive work or accumulation but from divine providence.'},{n:146,t:'Praise the Lord for he is good',v:'He rebuilds Jerusalem; he gathers the dispersed of Israel. He heals the brokenhearted; he binds up all their wounds.',g:'God cares for the needy and the brokenhearted. His providence reaches the stars and the humble, the ravens and the poor.'},{n:84,t:'Lord, you once favored your land',v:'Lord, you once favored your land. Mercy and faithfulness have met; justice and peace have embraced.',g:'Israel\'s restoration is God\'s free work. Divine generosity always precedes human merit and makes it possible.'},{n:40,t:'Happy the man who considers the poor',v:'Happy the man who considers the poor and the weak. The Lord will save him in the day of evil. The Lord will guard him, give him life.',g:'The blessedness of giving to the needy. God repays the generous not in coin but in protection and life.'},{n:124,t:'Those who put their trust in the Lord',v:'Those who put their trust in the Lord are like Mount Zion, that cannot be shaken, that stands forever. Jerusalem! The mountains surround her; so the Lord surrounds his people.',g:'Trust in God gives the soul a firmness no material wealth can provide. The Lord is an impregnable wall for those who trust in him.'}],gula:[{n:62,t:'O God, you are my God, for you I long',v:'O God, you are my God, for you I long; for you my soul is thirsting. My soul clings to you; your right hand holds me fast.',g:'The soul that rises early seeking God expresses a hunger no earthly food can satisfy. Only union with God calms man\'s deepest thirst.'},{n:64,t:'To you our praise is due in Zion',v:'To you our praise is due in Zion, O God. You care for the earth, give it water; you fill it with riches. You crown the year with your goodness.',g:'God provides abundantly for creation. Earth\'s fruits are his gift, not man\'s conquest, and deserve to be received with gratitude and moderation.'},{n:147,t:'O praise the Lord, Jerusalem',v:'O praise the Lord, Jerusalem! Zion, praise your God! He satisfies you with finest wheat; he sends out his word to the earth.',g:'God satiates his people with the best. Yet true satisfaction lies not in finest wheat but in the Word he sends to the earth.'},{n:'144 I',t:'I will give you glory, O God my King',v:'I will give you glory, O God my King. The Lord is kind and full of compassion, slow to anger, abounding in love. How good is the Lord to all, compassionate to all his creatures.',g:'God\'s goodness extends to all creatures without exception. The temperate man imitates this generosity without hoarding for himself what is a gift for all.'},{n:135,t:'O give thanks to the Lord for he is good',v:'O give thanks to the Lord for he is good, for his love has no end. He gives food to all living things, for his love has no end.',g:'God feeds every living creature. The grateful man recognizes that food is gift not entitlement, and receives it with temperance.'},{n:29,t:'I will praise you, Lord, you have rescued me',v:'I will praise you, Lord, you have rescued me and have not let my enemies rejoice over me. O Lord, you have raised my soul from the dead.',g:'Deliverance from danger invites sober, profound thanksgiving. One who has been rescued does not return to the excesses that enslaved.'},{n:45,t:'God is for us a refuge and strength',v:'God is for us a refuge and strength, a helper close at hand in time of distress. So we shall not fear though the earth should rock.',g:'The security God gives surpasses every sensory pleasure. Whoever has found this refuge needs not seek consolation in excess.'},{n:92,t:'The Lord is king, with majesty enrobed',v:'The Lord is king, with majesty enrobed. The Lord has robed himself with might; he has girded himself with power. Your throne has stood firm from of old.',g:'God\'s majesty surpasses all earthly grandeur. Before his eternity, the world\'s fleeting pleasures are shown in their true proportion.'}],lujuria:[{n:42,t:'Defend me, O God',v:'Defend me, O God, and plead my cause against a godless nation. O send forth your light and your truth; let these be my guide to your holy mountain.',g:'God\'s light and truth guide man toward purity. Whoever walks in divine truth distinguishes between authentic love and mere passion.'},{n:83,t:'How lovely is your dwelling place',v:'How lovely is your dwelling place, Lord God of hosts! My soul is longing and yearning, is yearning for the courts of the Lord. My heart and my soul ring out their joy to God, the living God.',g:'Ardent desire for God\'s temple purifies all other desires. When the heart finds its true object, disordered affections lose their power.'},{n:'118,105',t:'Your word is a lamp for my steps',v:'Your word is a lamp for my steps, a light for my path. I am your servant; grant me knowledge to know your will.',g:'God\'s Word illuminates the path and protects from the darkness of disorder. Whoever meditates on divine law finds clarity to discern the pure from the impure.'},{n:'26 II',t:'O Lord, hear my voice when I call',v:'O Lord, hear my voice when I call; have mercy and answer. Of you my heart has spoken: Seek his face. It is your face, O Lord, that I seek.',g:'Seeking God\'s face is the soul\'s noblest desire. Whoever seeks to contemplate God learns to look at others with respect and reverence.'},{n:120,t:'I lift up my eyes to the mountains',v:'I lift up my eyes to the mountains: from where shall come my help? My help shall come from the Lord who made heaven and earth.',g:'Help comes from above, not from creatures. The psalmist lifts his gaze toward God, turning it away from all that clouds it.'},{n:121,t:'I rejoiced when I heard them say',v:'I rejoiced when I heard them say: Let us go to God\'s house. And now our feet are standing within your gates, O Jerusalem.',g:'The joy of pilgrimage to the holy city elevates the spirit above earthly satisfactions. Communion with God and his people purifies the affections.'},{n:122,t:'To you have I lifted up my eyes',v:'To you have I lifted up my eyes, you who dwell in the heavens. Like the eyes of a servant on the hand of his master, so our eyes are on the Lord our God.',g:'A gaze fixed on God orders all other gazes. Whoever contemplates the Lord with the eyes of a faithful servant learns purity of heart.'},{n:'138 II',t:'You created my inmost being',v:'For it was you who created my being, knit me together in my mother\'s womb. I thank you for the wonder of my being, for the wonders of all your creation.',g:'The human body is God\'s admirable work. The psalmist contemplates with reverence the mystery of life, recognizing in the flesh a temple of the Creator.'}]}};

const DX={es:{
soberbia:{s:'«Aprended de mí, que soy manso y humilde de corazón, y hallaréis descanso para vuestras almas.» — Mt 11,29',p:'«Tanto más grande eres, cuanto más te humillas, y hallarás gracia delante de Dios.» — Eclesiástico 3,18',d:'«La humildad es el fundamento de todas las virtudes; por tanto, en un alma donde no existe esta virtud, no puede haber ninguna otra sino mera apariencia.» — San Agustín'},
envidia:{s:'«El amor no tiene envidia, el amor no es jactancioso, no se envanece.» — 1 Cor 13,4',p:'«La envidia es la tristeza por el bien ajeno. Quien es presa de ella peca contra la caridad, que se goza del bien del prójimo.» — Santo Tomás de Aquino, S.Th. II-II, q.36',d:'«Donde hay envidia y rivalidad, allí hay desorden y toda clase de maldad.» — Santiago 3,16'},
ira:{s:'«Airaos, pero no pequéis; no se ponga el sol sobre vuestro enojo.» — Ef 4,26',p:'«La ira es una locura breve; gobiérnala, pues si no la gobiernas ella te gobernará a ti.» — San Juan Crisóstomo',d:'«Bienaventurados los mansos, porque ellos heredarán la tierra.» — Mt 5,5'},
pereza:{s:'«¿Hasta cuándo, perezoso, has de estar acostado? ¿Cuándo te levantarás de tu sueño?» — Prov 6,9',p:'«La pereza espiritual, llamada acedia, es una tristeza que agobia el ánimo del hombre hasta el punto de que nada le agrada hacer.» — Santo Tomás de Aquino, S.Th. II-II, q.35',d:'«Trabaja como si todo dependiera de ti; confía como si todo dependiera de Dios.» — San Ignacio de Loyola'},
avaricia:{s:'«No acumuléis tesoros en la tierra, donde la polilla y el orín corroen. Acumulad tesoros en el cielo.» — Mt 6,19-20',p:'«Lo superfluo de los ricos es lo necesario de los pobres. Las cosas ajenas se poseen cuando se poseen las superfluas.» — San Agustín',d:'«Raíz de todos los males es el amor al dinero, por el cual algunos se extraviaron en la fe.» — 1 Tim 6,10'},
gula:{s:'«No os embriaguéis con vino, en lo cual hay disolución; antes bien sed llenos del Espíritu.» — Ef 5,18',p:'«Ayuna primero de toda falta y no de alimentos; porque de nada vale el ayuno del que se abstiene de comer y peca contra su prójimo.» — San Juan Crisóstomo',d:'«La gula es la puerta por donde entran todos los vicios, porque la intemperancia destruye todo buen propósito.» — San Gregorio Magno'},
lujuria:{s:'«¿No sabéis que vuestro cuerpo es templo del Espíritu Santo que está en vosotros? Glorificad, pues, a Dios en vuestro cuerpo.» — 1 Cor 6,19-20',p:'«La castidad es aquella virtud angélica que nos hace semejantes a los espíritus puros.» — San Juan Bosco',d:'«Bienaventurados los limpios de corazón, porque ellos verán a Dios.» — Mt 5,8'}},
en:{soberbia:{s:'"Learn from me, for I am meek and humble of heart, and you will find rest for your souls." — Mt 11:29',p:'"The greater you are, the more humble yourself; so you will find favor before God." — Sir 3:18',d:'"Humility is the foundation of all the other virtues; hence, in the soul in which this virtue does not exist there cannot be any other virtue except in mere appearance." — St. Augustine'},envidia:{s:'"Love is not envious or boastful or arrogant." — 1 Cor 13:4',p:'"Envy is sorrow at another\'s good. Whoever is prey to it sins against charity." — St. Thomas Aquinas',d:'"Where there is envy and selfish ambition, there will also be disorder." — Jas 3:16'},ira:{s:'"Be angry but do not sin; do not let the sun go down on your anger." — Eph 4:26',p:'"Anger is a brief madness; govern it, for if you do not govern it, it will govern you." — St. John Chrysostom',d:'"Blessed are the meek, for they shall inherit the earth." — Mt 5:5'},pereza:{s:'"How long will you lie there, O sluggard? When will you arise from your sleep?" — Prov 6:9',p:'"Spiritual sloth, called acedia, is a sadness that weighs on the soul so that nothing pleases it to do." — St. Thomas Aquinas',d:'"Work as if everything depended on you; trust as if everything depended on God." — St. Ignatius of Loyola'},avaricia:{s:'"Do not store up treasures on earth where moth and rust consume. Store up treasures in heaven." — Mt 6:19-20',p:'"The superfluous of the rich is the necessity of the poor. One possesses others\' goods when one possesses superfluities." — St. Augustine',d:'"The love of money is the root of all evils." — 1 Tim 6:10'},gula:{s:'"Do not get drunk with wine, for that is debauchery; but be filled with the Spirit." — Eph 5:18',p:'"Fast first from every fault and not from food; for fasting from food is useless if one sins against neighbor." — St. John Chrysostom',d:'"Gluttony is the door through which all vices enter." — St. Gregory the Great'},lujuria:{s:'"Do you not know that your body is a temple of the Holy Spirit within you? Glorify God in your body." — 1 Cor 6:19-20',p:'"Chastity is that angelic virtue which makes us resemble the pure spirits." — St. John Bosco',d:'"Blessed are the pure in heart, for they shall see God." — Mt 5:8'}}

// ═══ SVG GAUGE ═══
function mkGauge(val,label,sub,color,sz,zn){
const cx=sz/2,cy=sz/2,r=sz/2-12,SA=-225,EA=45,ARC=EA-SA;
const v2a=n=>SA+(n/5)*ARC;
const p=(a,rd)=>({x:cx+rd*Math.cos(a*Math.PI/180),y:cy+rd*Math.sin(a*Math.PI/180)});
const arc=(sa,ea,rd)=>{const s=p(sa,rd),e=p(ea,rd);return`M${s.x} ${s.y}A${rd} ${rd} 0 ${ea-sa>180?1:0} 1 ${e.x} ${e.y}`;};
const zones=[{f:0,t:1.25,c:'#D4C5A9'},{f:1.25,t:2.5,c:'#48BB78'},{f:2.5,t:3.75,c:'#ECC94B'},{f:3.75,t:5,c:'#E53E3E'}];
const na=v2a(val),tip=p(na,r-10),b1=p(na+90,3),b2=p(na-90,3),tail=p(na+180,12);
let ticks='';for(let i=0;i<=50;i++){const a2=SA+(i/50)*ARC,mj=i%10===0,ir=mj?r-16:r-8,p1=p(a2,ir),p2=p(a2,r-3);ticks+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${mj?'#5C4A32':'#C4A66A'}" stroke-width="${mj?1.5:0.5}"/>`;}
let nums='';[0,1,2,3,4,5].forEach(n=>{const ps=p(v2a(n),r-22);nums+=`<text x="${ps.x}" y="${ps.y}" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="700" fill="#5C4A32">${n}</text>`;});
const zl=val<=1.25?zn[0]:val<=2.5?zn[1]:val<=3.75?zn[2]:zn[3];
const zc=val<=1.25?'#8B7355':val<=2.5?'#48BB78':val<=3.75?'#D69E2E':'#E53E3E';
return`<div style="text-align:center;margin:4px"><svg width="${sz}" height="${sz*.82}" viewBox="0 0 ${sz} ${sz*.82}"><circle cx="${cx}" cy="${cy}" r="${r+6}" fill="none" stroke="#5C4A32" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${r+2}" fill="#FDFBF7"/>${zones.map(z=>`<path d="${arc(v2a(z.f),v2a(z.t),r-3)}" fill="none" stroke="${z.c}" stroke-width="8" opacity="0.85"/>`).join('')}${ticks}${nums}<polygon points="${tip.x},${tip.y} ${b1.x},${b1.y} ${tail.x},${tail.y} ${b2.x},${b2.y}" fill="#C0392B"/><circle cx="${cx}" cy="${cy}" r="6" fill="#5C4A32" stroke="#C4A66A" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="3" fill="#FAF6EF"/><rect x="${cx-18}" y="${cy+14}" width="36" height="14" rx="2" fill="#F5EFE4" stroke="#D4C5A9" stroke-width="0.5"/><text x="${cx}" y="${cy+23}" text-anchor="middle" font-size="9" font-weight="700" fill="${zc}">${val.toFixed(1)}</text></svg><div style="font-size:10px;font-weight:800;color:${color};letter-spacing:1px;text-transform:uppercase">${label}</div><div style="font-size:8px;color:#8B7355;letter-spacing:2px">${sub}</div><span style="font-size:7px;font-weight:700;color:${zc};background:${zc}18;border:1px solid ${zc}33;border-radius:3px;padding:1px 6px">${zl}</span></div>`;
}

// ═══ SVG COMPASS ═══
function mkCompass(res,sz,t){
const cx=sz/2,cy=sz/2,outerR=sz/2-35,innerR=22;
const pc=(d,rd)=>({x:cx+rd*Math.cos((d-90)*Math.PI/180),y:cy+rd*Math.sin((d-90)*Math.PI/180)});
const pts=F.map(f=>{const val=res[f.id]||0;const lf=fl(f.id);return{...f,...lf,val,pos:pc(f.angle,innerR+(val/5)*(outerR-innerR))};});
const dom=pts.reduce((m,p)=>p.val>m.val?p:m,{val:0});
let sx=0,sy=0;pts.forEach(p=>{const r2=((p.angle-90)*Math.PI)/180;sx+=p.val*Math.cos(r2);sy+=p.val*Math.sin(r2);});
const hD=(Math.atan2(sy,sx)*180/Math.PI+90+360)%360,hM=Math.sqrt(sx*sx+sy*sy);
const nL=Math.min(Math.max(hM*6,35),outerR*.85),nT=pc(hD,nL),nLt=pc(hD+90,6),nRt=pc(hD-90,6);
let rings='';[1,2,3,4,5].forEach(v=>{const rr=innerR+(v/5)*(outerR-innerR);rings+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#E8DFD0" stroke-width="0.5" ${v<5?'stroke-dasharray="2 4"':''}/>`;});
let axes='';F.forEach((f,i)=>{const ou=pc(f.angle,outerR+1),inn=pc(f.angle,innerR),lb=pc(f.angle,outerR+22);const lf=fl(f.id);axes+=`<line x1="${inn.x}" y1="${inn.y}" x2="${ou.x}" y2="${ou.y}" stroke="${f.color}" stroke-width="0.6" opacity="0.3"/><text x="${lb.x}" y="${lb.y}" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="800" fill="${f.color}">${(lf.l||f.id).toUpperCase()}</text>`;if(pts[i].val>0)axes+=`<circle cx="${pts[i].pos.x}" cy="${pts[i].pos.y}" r="4.5" fill="${f.color}" stroke="#FDFBF7" stroke-width="1.5"/>`;});
const poly=pts.map(p=>`${p.pos.x},${p.pos.y}`).join(' ');
const needle=hM>0.5?`<polygon points="${nT.x},${nT.y} ${nLt.x},${nLt.y} ${cx},${cy} ${nRt.x},${nRt.y}" fill="#C0392B" opacity="0.9"/>`:'';
return`<div style="text-align:center"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${sz/2-3}" fill="none" stroke="#5C4A32" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${sz/2-6}" fill="#FDFBF7" stroke="#C4A66A" stroke-width="1"/>${rings}${axes}<polygon points="${poly}" fill="${(dom.color||'#C0392B')}15" stroke="${dom.color||'#C0392B'}" stroke-width="1.5" stroke-linejoin="round"/>${needle}<circle cx="${cx}" cy="${cy}" r="10" fill="#5C4A32" stroke="#C4A66A" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="5" fill="#FAF6EF" stroke="#8B7355" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="2" fill="#5C4A32"/></svg><div style="display:flex;gap:12px;justify-content:center;margin-top:4px"><span style="font-size:9px;display:flex;align-items:center;gap:4px"><span style="width:14px;height:5px;background:#C0392B;border-radius:1px;display:inline-block"></span>${t.ne}</span><span style="font-size:9px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:5px;border:1.5px solid #48BB78;opacity:.5;display:inline-block"></span>${t.vZ}</span></div><p style="font-size:10px;color:var(--textM);margin:8px auto;max-width:280px;line-height:1.5">${t.hE}</p></div>`;
}

<div class="months-scroll">${t.mo.map((m,i)=>`<button class="mchip${S.sM===i?' on':' off'}" onclick="S.sM=${i};S.sD=1;render()">${m.substring(0,3)}</button>`).join('')}</div>
<div class="grid7">${Array.from({length:dias},(_,i)=>i+1).map(d=>{const has=S.jrs[`${S.sM}_${d}`];return`<button class="daybtn${S.sD===d?' sel':''}${has&&S.sD!==d?' has':''}" onclick="S.sD=${d};render()">${d}${has&&S.sD!==d?'<span class="dot"></span>':''}</button>`;}).join('')}</div>
<div style="text-align:center;margin-bottom:8px"><span class="pill" style="color:${calFat.color};background:${calFat.color}15">${calFl.l} · ${t.vi}: ${calFl.v}</span></div>
<div class="tabs"><button class="tab${S.tab==='c'?' on':' off'}" onclick="S.tab='c';render()">${t.cT}</button><button class="tab${S.tab==='a'?' on':' off'}" onclick="S.tab='a';render()">${t.aT}</button></div>
<div class="card"><div style="font-size:10px;letter-spacing:2px;color:var(--textL);text-transform:uppercase;margin-bottom:6px">${t.dy} ${S.sD} — ${t.mo[S.sM]}</div>
${S.tab==='c'?`<div style="font-size:14px;font-style:italic;color:var(--textM);line-height:1.5">"${calDc.c}"</div>`:`<div>${calDc.a.map((x,i)=>`<div style="font-size:13px;color:var(--textM);line-height:1.5;margin-bottom:4px">${i+1}. ${x}</div>`).join('')}</div>`}</div>
${dx.s?`<div class="card" style="border-left:3px solid ${calFat.color}">
<div style="font-size:9px;letter-spacing:2px;color:var(--textL);margin-bottom:6px">✝ SAGRADA ESCRITURA</div>
<div style="font-size:12px;font-style:italic;color:var(--textM);line-height:1.5">${dx.s}</div>
</div>`:''}
${dx.p?`<div class="card" style="border-left:3px solid var(--accentL)">
<div style="font-size:9px;letter-spacing:2px;color:var(--textL);margin-bottom:6px">⛪ SANTOS PADRES Y DOCTORES</div>
<div style="font-size:12px;font-style:italic;color:var(--textM);line-height:1.5">${dx.p}</div>
${dx.d?`<div style="font-size:12px;font-style:italic;color:var(--textM);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${dx.d}</div>`:''}
</div>`:''}
${(()=>{const cps=getPsalmForDate(calDate,calFat.id,S.lang);return cps?`<div class="card" style="border-left:3px solid ${calFat.color}"><div style="font-size:9px;letter-spacing:2px;color:var(--textL);margin-bottom:6px">✝ SALMO DEL DÍA</div><div style="font-size:12px;font-weight:700;color:${calFat.color};margin-bottom:4px">Salmo ${cps.n} · <span style="font-style:italic;font-weight:400;color:var(--textM)">${cps.t}</span></div><div style="font-size:12px;font-style:italic;color:var(--textM);line-height:1.5;margin-bottom:6px">${cps.v}</div><div style="font-size:11px;color:var(--textM);line-height:1.5;padding:8px;background:var(--borderL);border-radius:6px;font-style:italic">${cps.g}<div style="font-size:9px;color:var(--textL);margin-top:4px;font-style:normal">— García Cordero, BAC</div></div></div>`:'';})()}
${S.sD===dias?`<div class="card" style="border:1px solid var(--gold)"><div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px">📊 ${t.eo}</div><div style="font-size:11px;color:var(--textM)">${t.eT}</div><button class="btn" style="margin-top:8px" onclick="S.ans={};S.fI=0;S.qI=0;go('test')">${t.rt}</button></div>`:''}</div>`;return;}

// ═══ ALARM ═══
if(S.scr==='alarm'){
a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.al}</div><div style="font-size:11px;color:var(--textL);text-align:center;margin-bottom:20px">${t.re}</div>
<div class="card"><div style="font-size:48px;text-align:center;margin-bottom:12px">⏰</div><input type="time" value="${S.alTime}" onchange="S.alTime=this.value" style="font-size:32px;font-weight:700;text-align:center;color:var(--text);background:var(--borderL);padding:8px;border-radius:8px;border:none;width:100%">
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span style="font-size:12px;color:var(--textM)">${t.da}</span><button class="switch" style="background:${S.alOn?'var(--accent)':'var(--border)'}" onclick="S.alOn=!S.alOn;render()"><span class="knob" style="left:${S.alOn?'27px':'3px'}"></span></button></div>
${S.alOn?`<div style="margin-top:12px;padding:10px;background:var(--borderL);border-radius:8px"><div style="font-size:9px;letter-spacing:2px;color:var(--textL);margin-bottom:6px">${t.pv}</div><div style="background:var(--card);border-radius:8px;padding:10px;border:1px solid var(--border)"><div style="font-size:12px;font-weight:700;color:var(--text)">${t.rf}</div><div style="font-size:10px;color:var(--textM)">${t.fa}: ${fatLoc.l} · ${t.vi}: ${fatLoc.v}</div></div></div>`:''}</div></div>`;return;}

// ═══ REPERTOIRE ═══
if(S.scr==='repertoire'){
a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.rT}</div><div style="font-size:11px;color:var(--textL);text-align:center;margin-bottom:10px">${t.rD}</div>
<div style="display:flex;gap:4px;margin-bottom:12px">${['spotify','apple','youtube'].map(p=>`<button class="platbtn" onclick="sP('${p}')" style="border-color:${S.plat===p?'var(--accent)':'var(--border)'};background:${S.plat===p?'var(--accent)':'transparent'};color:${S.plat===p?'#FFF':'var(--textL)'}">${p==='spotify'?'🟢 Spotify':p==='apple'?'🍎 Apple':'🔴 YouTube'}</button>`).join('')}</div>
${F.map(f=>{const lf=fl(f.id);const pcs=MU[f.id];return`<div class="repgrp"><div class="rephdr" style="border-bottom:2px solid ${f.color};background:${f.color}10"><span style="font-size:12px;font-weight:700;color:${f.color}">${lf.l}</span><span style="font-size:9px;color:var(--textL)">${t.vi}: ${lf.v}</span></div><div class="repbody">${pcs.map((p,i)=>`<div class="reprow" onclick="oM('${f.id}',${i})" style="${i<pcs.length-1?'border-bottom:1px solid var(--border)':''}"><div class="repplay" style="background:${f.color}">▶</div><div><div style="font-size:11px;font-weight:600;color:var(--text)">${p.t}</div><div style="font-size:9px;color:var(--textL)">${p.c} · ${p.d}</div></div></div>`).join('')}</div></div>`;}).join('')}</div>`;return;}

// ═══ JOURNAL ═══
if(S.scr==='journal'){
const entries=Object.entries(S.jrs).slice(-5).reverse();
a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.jo}</div><div style="font-size:11px;color:var(--textL);text-align:center;margin-bottom:16px">${t.dy} ${S.sD} — ${t.mo[S.sM]}</div>
<div class="card"><div style="font-size:10px;letter-spacing:2px;color:var(--textL);margin-bottom:8px">${t.yR}</div><textarea id="jrtx" placeholder="${t.pl}">${S.jr}</textarea><button class="btn" style="margin-top:8px" onclick="svJ()">${t.sR}</button></div>
${entries.length?`<div style="margin-top:16px"><div style="font-size:10px;font-weight:700;color:var(--textL);letter-spacing:1px;margin-bottom:8px">${t.pr}</div>${entries.map(([k,tx])=>{const[m,d]=k.split('_');return`<div style="padding:10px;background:var(--cardAlt);border-radius:8px;border:1px solid var(--border);margin-bottom:6px"><div style="font-size:9px;color:var(--textL)">${d} — ${t.mo[parseInt(m)]}</div><div style="font-size:11px;color:var(--textM);margin-top:4px;line-height:1.4">${tx}</div></div>`;}).join('')}</div>`:''}</div>`;return;}

// ═══ THEORY ═══
if(S.scr==='theory'){
a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.thT}</div>
<div class="card"><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px">${t.guideT}</div><div style="font-size:12px;color:var(--textM);line-height:1.7">${t.guide.replace(/\n/g,'<br>')}</div></div>
<div class="card"><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px">${t.thH}</div><div style="font-size:12px;color:var(--textM);line-height:1.6;margin-bottom:8px">${t.thP}</div>
${F.map((f,i)=>{const lf=fl(f.id);return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;${i>0?'border-top:1px solid var(--border)':''}"><span style="width:8px;height:8px;border-radius:4px;background:${f.color};flex-shrink:0"></span><div><div style="font-size:11px"><span style="font-weight:700;color:${f.color}">${lf.l}</span> <span style="color:var(--textL)">— ${t.ye} ${lf.a}</span></div><div style="font-size:10px;color:var(--textM)">${t.cf}: ${lf.v}</div></div></div>`;}).join('')}</div>
<div class="card"><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px">${t.meT}</div><div style="font-size:12px;color:var(--textM);line-height:1.6">${t.meP}</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${[{c:'#D4C5A9',l:t.zn[0]+' (0-1.25)'},{c:'#48BB78',l:t.zn[1]+' (1.25-2.5)'},{c:'#ECC94B',l:t.zn[2]+' (2.5-3.75)'},{c:'#E53E3E',l:t.zn[3]+' (3.75-5)'}].map(z=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:16px;height:8px;background:${z.c};border-radius:2px;display:inline-block"></span><span style="font-size:9px;color:var(--textM)">${z.l}</span></span>`).join('')}</div></div></div>`;return;}

// ═══ HISTORY ═══
if(S.scr==='history'){
const hist=S.history;
let content='';
if(hist.length===0){content=`<div style="text-align:center;margin-top:40px;color:var(--textL)">${t.hiNone}<br><br><button class="btn" style="max-width:200px;margin:0 auto" onclick="go('test')">${t.st}</button></div>`;}
else{
// Evolution bars per fatigue
content+=`<div class="card">`;
F.forEach(f=>{
const lf=fl(f.id);
const vals=hist.map(h=>h.results[f.id]||0);
const last=vals[vals.length-1];
const zc=last<=1.25?'#8B7355':last<=2.5?'#48BB78':last<=3.75?'#D69E2E':'#E53E3E';
content+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px"><span style="font-size:10px;font-weight:700;color:${f.color}">${lf.l}</span><span style="font-size:10px;font-weight:700;color:${zc}">${last.toFixed(1)}</span></div>`;
content+=`<div class="evobar">`;
vals.forEach(v=>{const h=Math.max(4,v/5*55);const c=v<=1.25?'#D4C5A9':v<=2.5?'#48BB78':v<=3.75?'#ECC94B':'#E53E3E';content+=`<div style="height:${h}px;background:${c}"></div>`;});
content+=`</div></div>`;
});
// Month labels
content+=`<div style="display:flex;gap:2px;margin-top:4px">${hist.map(h=>`<div style="flex:1;text-align:center;font-size:7px;color:var(--textL)">${h.key.substring(5)}</div>`).join('')}</div>`;
content+=`</div>`;

// Improvement areas (compare last two)
if(hist.length>=2){
const prev=hist[hist.length-2].results;
const curr=hist[hist.length-1].results;
content+=`<div style="font-size:10px;font-weight:700;color:var(--textL);letter-spacing:1px;margin:12px 0 8px">${t.hiAreas}</div>`;
F.forEach(f=>{
const lf=fl(f.id);
const p=prev[f.id]||0,c=curr[f.id]||0;
const diff=c-p;
let status,icon,col;
if(diff<-0.3){status=t.hiUp;icon='✓';col='#48BB78';}
else if(diff>0.3){status=t.hiDown;icon='⚠';col='#E53E3E';}
else{status=t.hiStable;icon='≈';col='#8B7355';}
content+=`<div class="improve" style="border-color:${col};background:${col}08"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:700;color:${f.color}">${lf.l}</span><span style="font-size:10px;color:${col}">${status} (${diff>0?'+':''}${diff.toFixed(1)})</span></div><div style="font-size:10px;color:var(--textM);margin-top:2px">${diff>0.3?t.cf+': '+lf.v:diff<-0.3?'→ '+lf.v+' ✓':''}</div></div>`;
});
} else if(hist.length===1){
content+=`<div style="font-size:10px;font-weight:700;color:var(--textL);letter-spacing:1px;margin:12px 0 8px">${t.hiAreas}</div>`;
const curr=hist[0].results;
const sorted=Object.entries(curr).sort((a,b)=>b[1]-a[1]).slice(0,3);
sorted.forEach(([id,val])=>{
if(val>1.25){const lf=fl(id);const f=F.find(x=>x.id===id);
content+=`<div class="improve" style="border-color:${f.color};background:${f.color}08"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:700;color:${f.color}">${lf.l} (${val.toFixed(1)})</span><span style="font-size:10px;color:var(--textL)">${t.hiNew}</span></div><div style="font-size:10px;color:var(--textM);margin-top:2px">${t.cf}: ${lf.v}</div></div>`;}
});
}}

a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.hiT}</div>${content}</div>`;return;}
}

// ═══ ACTIONS ═══
function go(s){S.scr=s;window.scrollTo(0,0);render();}
function cL(c){S.lang=c;localStorage.setItem('pi_lang',c);render();}
function sP(p){S.plat=p;localStorage.setItem('pi_plat',p);render();}
function ans(v){const ak=`${F[S.fI].id}_${S.qI}`;S.ans[ak]=v;
setTimeout(()=>{if(S.qI<9)S.qI++;else if(S.fI<6){S.fI++;S.qI=0;}
else{const res={};F.forEach(f=>{let sum=0;for(let i=0;i<10;i++)sum+=(S.ans[`${f.id}_${i}`]||0);res[f.id]=sum/10;});
S.res=res;localStorage.setItem('pi_res',JSON.stringify(res));saveHistory(res);S.scr='results';}render();},200);}
function svJ(){const tx=document.getElementById('jrtx')?.value;if(tx?.trim()){S.jrs[`${S.sM}_${S.sD}`]=tx.trim();S.jr='';localStorage.setItem('pi_jrs',JSON.stringify(S.jrs));render();}}

window.go=go;window.cL=cL;window.sP=sP;window.oM=oM;window.ans=ans;window.svJ=svJ;

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}
render();
</script>
</body>
</html>
