body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none;max-width:430px;margin:0 auto;min-height:100dvh}
.page{padding:8px 16px 24px;min-height:100dvh}

.btn{width:100%;padding:12px;background:var(--accent);border-radius:8px;text-align:center;color:var(--bg);font-size:12px;font-weight:600;border:none;cursor:pointer;letter-spacing:.5px}
.btn:active{opacity:.85}
.back{color:var(--textL);font-size:12px;padding:4px 0;margin-bottom:8px;cursor:pointer;background:none;border:none;text-align:left}
.title{text-align:center;font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.flags{display:flex;justify-content:flex-end;gap:3px;margin-bottom:4px}
.flag{background:transparent;border:none;border-radius:4px;padding:2px 4px;cursor:pointer;font-size:14px}
.flag.on{background:rgba(92,74,50,.12)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid3 .card{margin-bottom:0;text-align:center;padding:14px 4px;cursor:pointer}
.menicon{font-size:24px}
.menlbl{font-size:10px;color:var(--textM);margin-top:4px;white-space:pre-line}
.calicon{width:32px;height:32px;border-radius:5px;background:#FFF;border:1.5px solid var(--accent);overflow:hidden;display:inline-flex;flex-direction:column;align-items:center;margin:0 auto}
.calicon .top{background:var(--accent);width:100%;text-align:center;padding:0 0 1px}
.calicon .top span{font-size:5.5px;font-weight:800;color:#FFF;letter-spacing:1px}
.calicon .num{font-size:13px;font-weight:800;color:var(--text);line-height:1.1}
.tabs{display:flex;margin-bottom:8px}
.tab{flex:1;padding:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;text-align:center}
.tab.on{background:var(--accent);color:#FFF}
.tab.off{background:var(--borderL);color:var(--textL)}
.tab:first-child{border-radius:8px 0 0 8px}.tab:last-child{border-radius:0 8px 8px 0}
.pill{font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 14px;border-radius:12px;display:inline-block}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--cardAlt);cursor:pointer}
.opt:active{opacity:.85}
.switch{width:50px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s}
.switch .knob{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#FFF;transition:left .2s}
textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;color:var(--text);background:var(--cardAlt);resize:vertical;font-family:inherit}
.months-scroll{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.months-scroll::-webkit-scrollbar{display:none}
.mchip{padding:4px 8px;border-radius:12px;font-size:10px;font-weight:600;border:none;cursor:pointer;white-space:nowrap}
.mchip.on{background:var(--accent);color:#FFF}.mchip.off{background:transparent;color:var(--textL)}
.daybtn{padding:6px 0;border-radius:6px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;position:relative;border:1px solid var(--border);background:var(--cardAlt);color:var(--textM)}
.daybtn.sel{background:var(--accent);border-color:var(--accent);color:#FFF}
.daybtn.has{background:var(--borderL);border-color:#D4C5A9}
.dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--gold)}
.repgrp{margin-bottom:10px}
.rephdr{padding:8px;display:flex;justify-content:space-between;border-radius:8px 8px 0 0}
.repbody{background:var(--cardAlt);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:6px}
.reprow{display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer}
.repplay{width:28px;height:28px;border-radius:14px;display:flex;justify-content:center;align-items:center;color:#FFF;font-size:11px;flex-shrink:0}
.platbtn{flex:1;padding:6px 4px;border-radius:8px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border)}
.splash{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100dvh;background:#F0E8D8;text-align:center;padding:20px}
.splash h1{font-size:26px;font-weight:700;color:var(--text);margin-top:8px;white-space:pre-line;line-height:1.3}
.splash .line{width:60px;height:1px;background:var(--accentL);margin:12px 0;opacity:.5}

.evobar{display:flex;align-items:flex-end;gap:2px;height:60px}
.evobar div{flex:1;border-radius:2px 2px 0 0;min-width:8px;transition:height .3s}

// ═══ SEEDED WEEKLY SHUFFLE ═══
function seedShuffle(weekNum,year){
  let s=weekNum*7919+year*104729;
  const rng=()=>{s=((s*16807)%2147483647);return(s&0x7fffffff)/0x7fffffff;};
  const arr=[0,1,2,3,4,5,6];
  for(let i=6;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function getDoy(d){
  const utc=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const jan1=Date.UTC(d.getFullYear(),0,1);
  return Math.floor((utc-jan1)/864e5);
}
function getFatigaForDate(d){
  const doy=getDoy(d);
  const weekNum=Math.floor(doy/7);
  const dayInWeek=doy%7;
  const order=seedShuffle(weekNum,d.getFullYear());
  return F[order[dayInWeek]];
}
function getWeekOrder(d){
  const doy=getDoy(d);
  const weekNum=Math.floor(doy/7);
  return seedShuffle(weekNum,d.getFullYear()).map(i=>F[i]);
}

// ═══ MUSIC FOR DAY ═══
function getMusicForDate(d,fatId){
  const doy=getDoy(d);
  const weekIdx=Math.floor(doy/7)%8;
  return MU[fatId][weekIdx];
}

function saveHistory(res){

  const key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

// ═══ SVG GAUGE ═══
function mkGauge(val,label,sub,color,sz,zn){
const cx=sz/2,cy=sz/2,r=sz/2-12,SA=-225,EA=45,ARC=EA-SA;
const v2a=n=>SA+(n/5)*ARC;
const p=(a,rd)=>({x:cx+rd*Math.cos(a*Math.PI/180),y:cy+rd*Math.sin(a*Math.PI/180)});
const arc=(sa,ea,rd)=>{const s=p(sa,rd),e=p(ea,rd);return`M${s.x} ${s.y}A${rd} ${rd} 0 ${ea-sa>180?1:0} 1 ${e.x} ${e.y}`;};
const zones=[{f:0,t:1.25,c:'#D4C5A9'},{f:1.25,t:2.5,c:'#48BB78'},{f:2.5,t:3.75,c:'#ECC94B'},{f:3.75,t:5,c:'#E53E3E'}];
const na=v2a(val),tip=p(na,r-10),b1=p(na+90,3),b2=p(na-90,3),tail=p(na+180,12);
let ticks='';for(let i=0;i<=50;i++){const a2=SA+(i/50)*ARC,mj=i%10===0,ir=mj?r-16:r-8,p1=p(a2,ir),p2=p(a2,r-3);ticks+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${mj?'#5C4A32':'#C4A66A'}" stroke-width="${mj?1.5:0.5}"/>`;}
let nums='';[0,1,2,3,4,5].forEach(n=>{const ps=p(v2a(n),r-22);nums+=`<text x="${ps.x}" y="${ps.y}" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="700" fill="#5C4A32">${n}</text>`;});
const zl=val<=1.25?zn[0]:val<=2.5?zn[1]:val<=3.75?zn[2]:zn[3];
const zc=val<=1.25?'#8B7355':val<=2.5?'#48BB78':val<=3.75?'#D69E2E':'#E53E3E';
return`<div style="text-align:center;margin:4px"><svg width="${sz}" height="${sz*.82}" viewBox="0 0 ${sz} ${sz*.82}"><circle cx="${cx}" cy="${cy}" r="${r+6}" fill="none" stroke="#5C4A32" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${r+2}" fill="#FDFBF7"/>${zones.map(z=>`<path d="${arc(v2a(z.f),v2a(z.t),r-3)}" fill="none" stroke="${z.c}" stroke-width="8" opacity="0.85"/>`).join('')}${ticks}${nums}<polygon points="${tip.x},${tip.y} ${b1.x},${b1.y} ${tail.x},${tail.y} ${b2.x},${b2.y}" fill="#C0392B"/><circle cx="${cx}" cy="${cy}" r="6" fill="#5C4A32" stroke="#C4A66A" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="3" fill="#FAF6EF"/><rect x="${cx-18}" y="${cy+14}" width="36" height="14" rx="2" fill="#F5EFE4" stroke="#D4C5A9" stroke-width="0.5"/><text x="${cx}" y="${cy+23}" text-anchor="middle" font-size="9" font-weight="700" fill="${zc}">${val.toFixed(1)}</text></svg><div style="font-size:10px;font-weight:800;color:${color};letter-spacing:1px;text-transform:uppercase">${label}</div><div style="font-size:8px;color:#8B7355;letter-spacing:2px">${sub}</div><span style="font-size:7px;font-weight:700;color:${zc};background:${zc}18;border:1px solid ${zc}33;border-radius:3px;padding:1px 6px">${zl}</span></div>`;
}

// ═══ SVG COMPASS ═══
function mkCompass(res,sz,t){
const cx=sz/2,cy=sz/2,outerR=sz/2-35,innerR=22;
const pc=(d,rd)=>({x:cx+rd*Math.cos((d-90)*Math.PI/180),y:cy+rd*Math.sin((d-90)*Math.PI/180)});
const pts=F.map(f=>{const val=res[f.id]||0;const lf=fl(f.id);return{...f,...lf,val,pos:pc(f.angle,innerR+(val/5)*(outerR-innerR))};});
const dom=pts.reduce((m,p)=>p.val>m.val?p:m,{val:0});
let sx=0,sy=0;pts.forEach(p=>{const r2=((p.angle-90)*Math.PI)/180;sx+=p.val*Math.cos(r2);sy+=p.val*Math.sin(r2);});
const hD=(Math.atan2(sy,sx)*180/Math.PI+90+360)%360,hM=Math.sqrt(sx*sx+sy*sy);
const nL=Math.min(Math.max(hM*6,35),outerR*.85),nT=pc(hD,nL),nLt=pc(hD+90,6),nRt=pc(hD-90,6);
let rings='';[1,2,3,4,5].forEach(v=>{const rr=innerR+(v/5)*(outerR-innerR);rings+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#E8DFD0" stroke-width="0.5" ${v<5?'stroke-dasharray="2 4"':''}/>`;});
let axes='';F.forEach((f,i)=>{const ou=pc(f.angle,outerR+1),inn=pc(f.angle,innerR),lb=pc(f.angle,outerR+22);const lf=fl(f.id);axes+=`<line x1="${inn.x}" y1="${inn.y}" x2="${ou.x}" y2="${ou.y}" stroke="${f.color}" stroke-width="0.6" opacity="0.3"/><text x="${lb.x}" y="${lb.y}" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="800" fill="${f.color}">${(lf.l||f.id).toUpperCase()}</text>`;if(pts[i].val>0)axes+=`<circle cx="${pts[i].pos.x}" cy="${pts[i].pos.y}" r="4.5" fill="${f.color}" stroke="#FDFBF7" stroke-width="1.5"/>`;});
const poly=pts.map(p=>`${p.pos.x},${p.pos.y}`).join(' ');
const needle=hM>0.5?`<polygon points="${nT.x},${nT.y} ${nLt.x},${nLt.y} ${cx},${cy} ${nRt.x},${nRt.y}" fill="#C0392B" opacity="0.9"/>`:'';
return`<div style="text-align:center"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${sz/2-3}" fill="none" stroke="#5C4A32" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${sz/2-6}" fill="#FDFBF7" stroke="#C4A66A" stroke-width="1"/>${rings}${axes}<polygon points="${poly}" fill="${(dom.color||'#C0392B')}15" stroke="${dom.color||'#C0392B'}" stroke-width="1.5" stroke-linejoin="round"/>${needle}<circle cx="${cx}" cy="${cy}" r="10" fill="#5C4A32" stroke="#C4A66A" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="5" fill="#FAF6EF" stroke="#8B7355" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="2" fill="#5C4A32"/></svg><div style="display:flex;gap:12px;justify-content:center;margin-top:4px"><span style="font-size:9px;display:flex;align-items:center;gap:4px"><span style="width:14px;height:5px;background:#C0392B;border-radius:1px;display:inline-block"></span>${t.ne}</span><span style="font-size:9px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:5px;border:1.5px solid #48BB78;opacity:.5;display:inline-block"></span>${t.vZ}</span></div><p style="font-size:10px;color:var(--textM);margin:8px auto;max-width:280px;line-height:1.5">${t.hE}</p></div>`;
}

else if(diff>0.3){status=t.hiDown;icon='⚠';col='#E53E3E';}
else{status=t.hiStable;icon='≈';col='#8B7355';}
content+=`<div class="improve" style="border-color:${col};background:${col}08"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:700;color:${f.color}">${lf.l}</span><span style="font-size:10px;color:${col}">${status} (${diff>0?'+':''}${diff.toFixed(1)})</span></div><div style="font-size:10px;color:var(--textM);margin-top:2px">${diff>0.3?t.cf+': '+lf.v:diff<-0.3?'→ '+lf.v+' ✓':''}</div></div>`;
});
} else if(hist.length===1){
content+=`<div style="font-size:10px;font-weight:700;color:var(--textL);letter-spacing:1px;margin:12px 0 8px">${t.hiAreas}</div>`;
const curr=hist[0].results;
const sorted=Object.entries(curr).sort((a,b)=>b[1]-a[1]).slice(0,3);
sorted.forEach(([id,val])=>{
if(val>1.25){const lf=fl(id);const f=F.find(x=>x.id===id);
content+=`<div class="improve" style="border-color:${f.color};background:${f.color}08"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:700;color:${f.color}">${lf.l} (${val.toFixed(1)})</span><span style="font-size:10px;color:var(--textL)">${t.hiNew}</span></div><div style="font-size:10px;color:var(--textM);margin-top:2px">${t.cf}: ${lf.v}</div></div>`;}
});
}}

a.innerHTML=`<div class="page"><button class="back" onclick="go('home')">${t.bk}</button><div class="title">${t.hiT}</div>${content}</div>`;return;}
}

// ═══ ACTIONS ═══
function go(s){S.scr=s;window.scrollTo(0,0);render();}
function cL(c){S.lang=c;localStorage.setItem('pi_lang',c);render();}
function sP(p){S.plat=p;localStorage.setItem('pi_plat',p);render();}
function ans(v){const ak=`${F[S.fI].id}_${S.qI}`;S.ans[ak]=v;
setTimeout(()=>{if(S.qI<9)S.qI++;else if(S.fI<6){S.fI++;S.qI=0;}
else{const res={};F.forEach(f=>{let sum=0;for(let i=0;i<10;i++)sum+=(S.ans[`${f.id}_${i}`]||0);res[f.id]=sum/10;});
S.res=res;localStorage.setItem('pi_res',JSON.stringify(res));saveHistory(res);S.scr='results';}render();},200);}
function svJ(){const tx=document.getElementById('jrtx')?.value;if(tx?.trim()){S.jrs[`${S.sM}_${S.sD}`]=tx.trim();S.jr='';localStorage.setItem('pi_jrs',JSON.stringify(S.jrs));render();}}

window.go=go;window.cL=cL;window.sP=sP;window.oM=oM;window.ans=ans;window.svJ=svJ;

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}
render();
</script>
